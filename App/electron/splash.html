<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1e1e1e;
      overflow: hidden;
      border-radius: 16px;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    .close-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.6);
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
      transition: background 0.15s, color 0.15s;
      z-index: 10;
    }

    .close-btn:hover {
      background: rgba(232, 17, 35, 0.9);
      color: #fff;
    }

    .video-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    img.logo {
      max-width: 80px;
      max-height: 80px;
      animation: floatAndPulse 2.4s ease-in-out infinite;
    }

    @keyframes floatAndPulse {
      0% {
        transform: translateY(0) scale(0.96);
        filter: drop-shadow(0 4px 8px rgba(92, 124, 250, 0.2));
      }
      50% {
        transform: translateY(-6px) scale(1.02);
        filter: drop-shadow(0 12px 16px rgba(92, 124, 250, 0.5));
      }
      100% {
        transform: translateY(0) scale(0.96);
        filter: drop-shadow(0 4px 8px rgba(92, 124, 250, 0.2));
      }
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top: 2px solid #5C7CFA;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 10px;
      -webkit-app-region: no-drag;
      animation: fadeIn 0.8s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <button class="close-btn" onclick="window.close()" title="Close">✕</button>
  <div class="video-container">
    <div class="logo-wrapper">
      <img src="logotransparent.png" alt="Shadow IDE Logo" class="logo">
      <div class="spinner"></div>
    </div>
  </div>
  <div class="message">Starting ShadowIDE...</div>
</body>
</html>
